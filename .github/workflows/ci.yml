name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: hmm
          POSTGRES_DB: hmm_test
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:hmm@127.0.0.1:5499/hmm_test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo +nightly fmt --check
      - name: clippy
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: test
        run: cargo +stable test
      - name: the schema matches the published client
        run: curl -fsSL https://unpkg.com/@dorsk/hmm/schema/envelope.v1.json | diff - schema/envelope.v1.json
