<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:," />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>hmm admin</title>
		<script>
			(function () {
				try {
					var d = document.documentElement;
					var b = JSON.parse(localStorage.getItem('tsumikit-theme') || 'null');
					if (!b || typeof b !== 'object') return;
					var dark = matchMedia('(prefers-color-scheme: dark)').matches;
					var m = b.mode === 'auto' ? (dark ? 'dark' : 'light') : b.mode === 'light' ? 'light' : 'dark';
					if (typeof b[m] === 'string' && b[m]) d.setAttribute('data-theme', b[m]);
					d.setAttribute('data-mode', m);
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="app" style="display: contents"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
